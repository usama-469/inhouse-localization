<svg viewBox="0 0 1060 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five-step pipeline: detect markers, build 3D-2D correspondences, solve one PnP over all of them, invert the result to a camera position, then attach a quality estimate.">
  <rect x="0" y="0" width="1060" height="260" fill="#fcfcfb" rx="10"/>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <polygon points="0,0 8,3.5 0,7" fill="#0b0b0b"/>
    </marker>
  </defs>

  <!-- input -->
  <text x="20" y="88" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#52514e">in: video frame</text>

  <!-- boxes -->
  <g font-family="Helvetica,Arial,sans-serif">
    <!-- 1 Detect -->
    <rect x="20" y="100" width="130" height="90" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
    <circle cx="38" cy="117" r="10" fill="#2a78d6"/><text x="38" y="121" text-anchor="middle" font-size="11" fill="#fff">1</text>
    <text x="85" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Detect</text>
    <text x="85" y="160" text-anchor="middle" font-size="9.5" fill="#52514e">cv2.aruco</text>
    <text x="85" y="172" text-anchor="middle" font-size="9.5" fill="#52514e">.detectMarkers</text>

    <!-- 2 Correspond -->
    <rect x="227.5" y="100" width="130" height="90" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
    <circle cx="245.5" cy="117" r="10" fill="#2a78d6"/><text x="245.5" y="121" text-anchor="middle" font-size="11" fill="#fff">2</text>
    <text x="292.5" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Correspond</text>
    <text x="292.5" y="160" text-anchor="middle" font-size="9.5" fill="#52514e">build_correspondences</text>
    <text x="292.5" y="172" text-anchor="middle" font-size="9.5" fill="#52514e">N markers → 4N pairs</text>

    <!-- 3 Solve -->
    <rect x="435" y="100" width="130" height="90" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
    <circle cx="453" cy="117" r="10" fill="#2a78d6"/><text x="453" y="121" text-anchor="middle" font-size="11" fill="#fff">3</text>
    <text x="500" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Solve</text>
    <text x="500" y="160" text-anchor="middle" font-size="9.5" fill="#52514e">one cv2.solvePnP</text>
    <text x="500" y="172" text-anchor="middle" font-size="9.5" fill="#52514e">over every corner</text>

    <!-- 4 Invert -->
    <rect x="642.5" y="100" width="130" height="90" rx="8" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
    <circle cx="660.5" cy="117" r="10" fill="#2a78d6"/><text x="660.5" y="121" text-anchor="middle" font-size="11" fill="#fff">4</text>
    <text x="707.5" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Invert</text>
    <text x="707.5" y="160" text-anchor="middle" font-size="9.5" fill="#52514e">C = −Rᵀ · tvec</text>
    <text x="707.5" y="172" text-anchor="middle" font-size="9.5" fill="#52514e">camera in world</text>

    <!-- 5 Grade -->
    <rect x="850" y="100" width="130" height="90" rx="8" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
    <circle cx="868" cy="117" r="10" fill="#eb6834"/><text x="868" y="121" text-anchor="middle" font-size="11" fill="#fff">5</text>
    <text x="915" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0b0b0b">Grade it</text>
    <text x="915" y="160" text-anchor="middle" font-size="9.5" fill="#52514e">reproj_px</text>
    <text x="915" y="172" text-anchor="middle" font-size="9.5" fill="#52514e">acc_est_m</text>
  </g>

  <!-- arrows + labels, drawn last so nothing else overlaps them -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="9.5" fill="#52514e" text-anchor="middle">
    <line x1="150" y1="145" x2="223" y2="145" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="186.5" y="132">corners, IDs</text>

    <line x1="357.5" y1="145" x2="431" y2="145" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="394.25" y="132">3D↔2D pairs</text>

    <line x1="565" y1="145" x2="638.5" y2="145" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="601.75" y="132">rvec, tvec</text>

    <line x1="772.5" y1="145" x2="846" y2="145" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="809.25" y="132">x, y, yaw</text>
  </g>

  <!-- output -->
  <line x1="980" y1="145" x2="1005" y2="145" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1013" y="136" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#52514e">UDP</text>
  <text x="1013" y="150" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#52514e">+ CSV</text>

  <text x="530" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b0b0b">runs fresh for every single frame — no smoothing, no memory of the last position</text>
</svg>
