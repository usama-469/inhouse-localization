<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A sailor finding a ship's position from known stars, next to a camera finding its position from known ceiling markers — the same math, pointed the other way.">
  <rect x="0" y="0" width="900" height="420" fill="#fcfcfb" rx="10"/>

  <!-- ===== Left: celestial navigation ===== -->
  <text x="220" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">What a sailor already knows how to do</text>

  <!-- stars -->
  <g stroke="#eb6834" stroke-width="2" fill="#eb6834">
    <g transform="translate(90,90)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(220,65)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(330,100)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
    <g transform="translate(180,140)"><line x1="-8" y1="0" x2="8" y2="0"/><line x1="0" y1="-8" x2="0" y2="8"/><line x1="-6" y1="-6" x2="6" y2="6"/><line x1="-6" y1="6" x2="6" y2="-6"/></g>
  </g>
  <text x="90" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#52514e">known position</text>

  <!-- sight lines converging on the ship -->
  <g stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="90" y1="90" x2="220" y2="300"/>
    <line x1="220" y1="65" x2="220" y2="300"/>
    <line x1="330" y1="100" x2="220" y2="300"/>
    <line x1="180" y1="140" x2="220" y2="300"/>
  </g>

  <!-- sea line -->
  <line x1="40" y1="330" x2="400" y2="330" stroke="#0b0b0b" stroke-width="1.5"/>
  <!-- ship hull -->
  <polygon points="180,330 260,330 245,352 195,352" fill="#2a78d6"/>
  <!-- mast -->
  <line x1="220" y1="330" x2="220" y2="300" stroke="#0b0b0b" stroke-width="2.5"/>
  <circle cx="220" cy="298" r="4" fill="#0b0b0b"/>

  <text x="220" y="385" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b0b0b">measure the angle to a few known stars</text>
  <text x="220" y="402" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b0b0b">→ work out where the ship is</text>

  <!-- ===== divider ===== -->
  <text x="450" y="215" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" fill="#52514e">=</text>
  <text x="450" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">same math,</text>
  <text x="450" y="254" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">upside down</text>

  <!-- ===== Right: this project ===== -->
  <text x="680" y="36" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#0b0b0b">What this project does instead</text>

  <!-- ceiling with markers -->
  <line x1="520" y1="90" x2="860" y2="90" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="530" y="78" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#52514e">ceiling, Z = ceiling_height_m</text>
  <g>
    <g transform="translate(560,90)">
      <rect x="-11" y="0" width="22" height="22" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
      <rect x="-5" y="6" width="4" height="4" fill="#2a78d6"/><rect x="1" y="6" width="4" height="4" fill="#2a78d6"/>
      <rect x="-5" y="12" width="4" height="4" fill="#2a78d6"/><rect x="1" y="12" width="4" height="4" fill="#2a78d6"/>
      <text x="0" y="36" text-anchor="middle" font-size="10" fill="#52514e">id 0</text>
    </g>
    <g transform="translate(660,90)">
      <rect x="-11" y="0" width="22" height="22" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
      <rect x="-5" y="6" width="4" height="4" fill="#2a78d6"/><rect x="1" y="6" width="4" height="4" fill="#2a78d6"/>
      <rect x="-5" y="12" width="4" height="4" fill="#2a78d6"/><rect x="1" y="12" width="4" height="4" fill="#2a78d6"/>
      <text x="0" y="36" text-anchor="middle" font-size="10" fill="#52514e">id 1</text>
    </g>
    <g transform="translate(760,90)">
      <rect x="-11" y="0" width="22" height="22" fill="#fff" stroke="#2a78d6" stroke-width="2"/>
      <rect x="-5" y="6" width="4" height="4" fill="#2a78d6"/><rect x="1" y="6" width="4" height="4" fill="#2a78d6"/>
      <rect x="-5" y="12" width="4" height="4" fill="#2a78d6"/><rect x="1" y="12" width="4" height="4" fill="#2a78d6"/>
      <text x="0" y="36" text-anchor="middle" font-size="10" fill="#52514e">id 2</text>
    </g>
  </g>

  <!-- sight lines converging on the camera -->
  <g stroke="#c3c2b7" stroke-width="1.2" stroke-dasharray="3,3">
    <line x1="560" y1="112" x2="680" y2="300"/>
    <line x1="660" y1="112" x2="680" y2="300"/>
    <line x1="760" y1="112" x2="680" y2="300"/>
  </g>

  <!-- cart + upward camera -->
  <rect x="650" y="330" width="60" height="24" rx="4" fill="#2a78d6"/>
  <circle cx="662" cy="358" r="7" fill="#0b0b0b"/>
  <circle cx="698" cy="358" r="7" fill="#0b0b0b"/>
  <circle cx="680" cy="322" r="9" fill="#fff" stroke="#0b0b0b" stroke-width="2"/>
  <circle cx="680" cy="322" r="3.5" fill="#0b0b0b"/>
  <line x1="680" y1="300" x2="680" y2="313" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#arrowUp)"/>

  <defs>
    <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto">
      <polygon points="0,7 4,0 8,7" fill="#0b0b0b"/>
    </marker>
  </defs>

  <text x="680" y="385" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b0b0b">measure the angle to a few known tags</text>
  <text x="680" y="402" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#0b0b0b">→ work out where the camera is</text>
</svg>
