<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart, log scale, comparing median lateral error between the unconstrained 6-DOF solver and the level-assuming 4-DOF solver across five test conditions. The 4-DOF solver is 100 times better when the mount is level, and 80 times worse once it is tilted 2 degrees.">
  <rect x="0" y="0" width="900" height="460" fill="#fcfcfb" rx="10"/>
  <text x="450" y="28" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0b0b0b">A constraint is a bet: "assume level" pays off big, or costs big</text>

  <!-- gridlines + y labels -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#52514e">
    <line x1="90" y1="370" x2="860" y2="370" stroke="#0b0b0b" stroke-width="1.2"/>
    <line x1="90" y1="281.1" x2="860" y2="281.1" stroke="#e3e2dc" stroke-width="1"/>
    <line x1="90" y1="192.2" x2="860" y2="192.2" stroke="#e3e2dc" stroke-width="1"/>
    <line x1="90" y1="103.3" x2="860" y2="103.3" stroke="#e3e2dc" stroke-width="1"/>
    <text x="82" y="373.5" text-anchor="end">0.01</text>
    <text x="82" y="284.6" text-anchor="end">0.1</text>
    <text x="82" y="195.7" text-anchor="end">1</text>
    <text x="82" y="106.8" text-anchor="end">10 mm</text>
  </g>
  <text x="30" y="210" text-anchor="middle" transform="rotate(-90,30,210)" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#52514e">median lateral error (log scale)</text>

  <!-- legend -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11.5">
    <rect x="620" y="46" width="14" height="14" fill="#2a78d6"/>
    <text x="638" y="57" fill="#0b0b0b">6-DOF (no assumption)</text>
    <rect x="620" y="66" width="14" height="14" fill="#eb6834"/>
    <text x="638" y="77" fill="#0b0b0b">4-DOF (assumes level)</text>
  </g>

  <!-- bars: category 1 -->
  <g>
    <rect x="117" y="121.8" width="45" height="248.2" fill="#2a78d6"/>
    <text x="139.5" y="114" text-anchor="middle" font-size="10" fill="#0b0b0b">6.20</text>
    <rect x="172" y="307.9" width="45" height="62.1" fill="#eb6834"/>
    <text x="194.5" y="300" text-anchor="middle" font-size="10" fill="#0b0b0b">0.05</text>
  </g>
  <!-- category 2 -->
  <g>
    <rect x="271" y="224.8" width="45" height="145.2" fill="#2a78d6"/>
    <text x="293.5" y="217" text-anchor="middle" font-size="10" fill="#0b0b0b">0.43</text>
    <rect x="326" y="343.2" width="45" height="26.8" fill="#eb6834"/>
    <text x="348.5" y="335" text-anchor="middle" font-size="10" fill="#0b0b0b">0.02</text>
  </g>
  <!-- category 3 -->
  <g>
    <rect x="425" y="122.2" width="45" height="247.8" fill="#2a78d6"/>
    <text x="447.5" y="114" text-anchor="middle" font-size="10" fill="#0b0b0b">6.13</text>
    <rect x="480" y="119.2" width="45" height="250.8" fill="#eb6834"/>
    <text x="502.5" y="111" text-anchor="middle" font-size="10" fill="#0b0b0b">6.63</text>
  </g>
  <!-- category 4 -->
  <g>
    <rect x="579" y="224.8" width="45" height="145.2" fill="#2a78d6"/>
    <text x="601.5" y="217" text-anchor="middle" font-size="10" fill="#0b0b0b">0.43</text>
    <rect x="634" y="117.8" width="45" height="252.2" fill="#eb6834"/>
    <text x="656.5" y="110" text-anchor="middle" font-size="10" fill="#0b0b0b">6.87</text>
  </g>
  <!-- category 5 -->
  <g>
    <rect x="733" y="233.9" width="45" height="136.1" fill="#2a78d6"/>
    <text x="755.5" y="226" text-anchor="middle" font-size="10" fill="#0b0b0b">0.34</text>
    <rect x="788" y="65.1" width="45" height="304.9" fill="#eb6834"/>
    <text x="810.5" y="57" text-anchor="middle" font-size="10" fill="#0b0b0b">26.93</text>
  </g>

  <!-- category labels -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b0b0b" text-anchor="middle">
    <text x="167" y="392">1 tag</text><text x="167" y="406" fill="#52514e">level</text>
    <text x="321" y="392">6 tags</text><text x="321" y="406" fill="#52514e">level</text>
    <text x="475" y="392">1 tag</text><text x="475" y="406" fill="#52514e">0.5° tilt</text>
    <text x="629" y="392">6 tags</text><text x="629" y="406" fill="#52514e">0.5° tilt</text>
    <text x="783" y="392">6 tags</text><text x="783" y="406" fill="#52514e">2° tilt</text>
  </g>

  <text x="450" y="436" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0b0b0b">level and unbroken: 4-DOF wins by ~100×. break the level promise by 2°: it loses by ~80×</text>
</svg>
